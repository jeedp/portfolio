  <body>
    <!-- Loading screen: a brief pulsing dot while the fonts load (first visit in a session only). -->
    <style>
      #boot { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: #efeeeb; transition: opacity .4s ease, visibility .4s; }
      [data-theme="dark"] #boot { background: #0e0e0e; }
      #boot span { width: 44px; height: 44px; border-radius: 50%; background: #e5472b; animation: boot-pulse 1s ease-in-out infinite; }
      [data-theme="dark"] #boot span { background: #ff5a3c; }
      #boot.done { opacity: 0; visibility: hidden; }
      @keyframes boot-pulse { 0% { transform: scale(0); } 100% { transform: scale(1); opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { #boot span { animation: none; opacity: .5; transform: scale(.4); } }
    </style>
    <div id="boot" role="status" aria-label="Loading"><span></span></div>
    <script>
      // Show the dot only until the fonts are ready (at most ~1 s), never waiting for images,
      // and skip it entirely on repeat views in the same browser session.
      (function () {
        var start = Date.now(), finished = false, seen = false
        try { seen = sessionStorage.getItem('jp-seen') === '1'; sessionStorage.setItem('jp-seen', '1') } catch (e) {}
        function reveal(minMs) {
          if (finished) return; finished = true
          setTimeout(function () {
            var b = document.getElementById('boot')
            window.__appReady = true
            window.dispatchEvent(new Event('app:ready'))
            if (b) { b.classList.add('done'); setTimeout(function () { b.remove() }, 450) }
          }, Math.max(0, minMs - (Date.now() - start)))
        }
        if (seen) { var b = document.getElementById('boot'); if (b) b.remove(); window.__appReady = true; return }
        var fonts = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()
        Promise.race([fonts, new Promise(function (r) { setTimeout(r, 1000) })]).then(function () { reveal(450) })
        setTimeout(function () { reveal(0) }, 1200) // hard cap
      })()
    </script>
